# Home APM — FALLBACK path (risk #5).
# For users who ALREADY run SigNoz somewhere and just want Home Assistant + the
# Home APM sidecar, without casting a new SigNoz stack. Ships only the two
# app services and points OTLP at the host.
#
# Run from the REPO ROOT:
#   docker compose -f deploy/docker-compose.fallback.yml up -d --build
#
# Compose v2 sets the project directory to this file's directory (deploy/), so
# relative host paths below resolve from deploy/ : ".." is the repo root and
# "../ha-config" is the seeded HA config.
#
# HA_TOKEN comes from deploy/homeapm.env (demo mode: generated by
# deploy/seed-token.sh from .ha-runtime/token.txt; BYOH: created by the user —
# see deploy/homeapm.env.example and NOTES.md).
services:
  homeassistant:
    image: homeassistant/home-assistant:stable
    container_name: home-apm-homeassistant
    volumes:
      - ../ha-config:/config
    ports:
      - "8123:8123"
    restart: unless-stopped

  homeapm-sidecar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: home-apm-sidecar
    environment:
      - HA_URL=http://homeassistant:8123
      # Existing SigNoz reachable from the container via the Docker host.
      # On Linux, host-gateway is mapped below so host.docker.internal resolves.
      - OTLP_ENDPOINT=http://host.docker.internal:4318
    # required: false (Compose v2.24+) - a MISSING env_file is a fatal
    # config-parse error for the whole project, so an unseeded token would
    # otherwise stop even Home Assistant from starting.
    env_file:
      - path: homeapm.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - homeassistant
    restart: unless-stopped

  homeapm-console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.console
    container_name: home-apm-console
    environment:
      # MCP + SigNoz reached via the Docker host (existing SigNoz install).
      - MCP_URL=http://host.docker.internal:8000/mcp
      - SIGNOZ_PUBLIC_URL=${SIGNOZ_PUBLIC_URL:-http://localhost:8080}
      - HA_PUBLIC_URL=${HA_PUBLIC_URL:-http://localhost:8123}
    # required: false - see the sidecar note above.
    env_file:
      - path: homeapm.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"
    depends_on:
      - homeassistant
    restart: unless-stopped
